name: Report to the ENCY store
description: >
  Tell the ENCY Extension Store how this run is getting on, so the author reads it on the extension's
  page instead of hunting through GitHub. Best-effort and credential-free: it signs with the
  workflow's own GitHub OIDC token (needs `permissions: id-token: write`) and never fails the job.

  The publish action reports its own steps already. This one exists for the steps BEFORE it — a
  compile error happens in the caller's workflow, where the publish action has not run yet and so
  cannot say anything.

inputs:
  status:
    description: RUNNING, FAILED or PUBLISHED.
    required: true
  failed-step:
    description: Which step gave up, for the message shown on the card.
    required: false
    default: ''
  version:
    description: Version being published, when known.
    required: false
    default: ''
  log-file:
    description: >
      A file whose tail becomes the reason shown on the extension's card — point it at the build log.
      Without it the card can only say WHICH step failed, which still sends the author to GitHub to
      find out why. Missing or unreadable is fine: the report just carries no reason.
    required: false
    default: ''
  api-base:
    description: Store API base URL.
    required: false
    default: 'https://apps.encycam.com/api'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        API: ${{ inputs.api-base }}
        ACTION_REF: ${{ github.action_ref }}
        FAILED_STEP: ${{ inputs.failed-step }}
        STATUS: ${{ inputs.status }}
        VERSION: ${{ inputs.version }}
        LOG_FILE: ${{ inputs.log-file }}
      run: |
        # The tail, not the head: a build log opens with a banner and ends with the error.
        if [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
          FAILURE_LOG="$(tail -c 3000 "$LOG_FILE" 2>/dev/null || true)"
          export FAILURE_LOG
        fi
        # One implementation of the report, shared with the publish action. For an action in a
        # subdirectory GITHUB_ACTION_PATH is that subdirectory, so the script sits one level up.
        "$GITHUB_ACTION_PATH/../report.sh" "$STATUS" "$VERSION" || true
        exit 0
