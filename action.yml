name: Publish ENCY Extension
description: >
  Publish an ENCY extension to the ENCY Extension Store. Takes a ready .nupkg, or packs a
  build-output folder first with the ENCY pack CLI, then publishes through the store REST API
  (parse-nupkg -> publish). The token's subject becomes the extension owner.
branding:
  icon: upload-cloud
  color: blue

inputs:
  token:
    description: >
      Bearer token for the store API (Keycloak realm licsys), from a repo secret. OPTIONAL once
      the repository is registered as the package's trusted publisher: leave it empty and the
      action authenticates with the workflow's own GitHub OIDC token instead (requires
      `permissions: id-token: write` in the workflow). The first publish of a NEW package still
      needs a token — it also auto-registers this repository as the trusted publisher.
    required: false
    default: ''
  nupkg:
    description: Path or glob of a ready .nupkg to publish. Mutually exclusive with `folder`.
    required: false
    default: ''
  folder:
    description: >
      Build-output folder to publish. Must be a FLAT build output: <Name>.dll +
      <Name>.settings.json + package.info.json (+ readme.md for the store card). Use
      `dotnet build`, not `dotnet publish` - publish drags all SDK dlls into the folder.
      By default the files are uploaded and the STORE BACKEND packs them (no tooling
      needed on the runner); pass `pack-cli` to pack locally with the ENCY CLI instead.
    required: false
    default: ''
  pack-cli:
    description: >
      Optional path to the ENCY pack CLI executable — packs on the runner instead of
      server-side packing.
    required: false
    default: ''
  version:
    description: >
      Version to stamp into package.info.json before packing (folder mode only). Typically
      derived from the pushed git tag. Empty = keep the version already in package.info.json.
    required: false
    default: ''
  licensed:
    description: Publish as a licensed (paid) extension.
    required: false
    default: 'false'
  category:
    description: >
      Storefront category id, e.g. operation, ai, geometry-io. Optional: left empty, the store keeps
      whatever category the extension already has, and a brand-new one waits for a moderator to sort
      it. The ids are at <api-base>/categories, and in prose at <api-base>/categories/guide.md.
    required: false
    default: ''
  dry-run:
    description: Pack and validate on the server (parse-nupkg), but skip the publish step.
    required: false
    default: 'false'
  api-base:
    description: Store API base URL.
    required: false
    default: 'https://apps.encycam.com/api'

outputs:
  package-id:
    description: Package id of the published extension
    value: ${{ steps.publish.outputs.package-id }}
  version:
    description: Published version
    value: ${{ steps.publish.outputs.version }}
  slug:
    description: Store card slug. Empty when the store took the package for review (see `submitted`)
    value: ${{ steps.publish.outputs.slug }}
  card-url:
    description: Store card URL. Empty when the store took the package for review (see `submitted`)
    value: ${{ steps.publish.outputs.card-url }}
  submitted:
    description: >
      'true' when the store took the package but did not publish it (HTTP 202), so there is no card
      yet. Empty when it was published. `state` says why.
    value: ${{ steps.publish.outputs.submitted }}
  state:
    description: >
      The store's state of the version when it answered 202: SUBMITTED (or empty) waits for a moderator,
      PENDING or SIGNED to be signed; FAILED, REJECTED and WITHDRAWN will not reach the catalog as they are.
    value: ${{ steps.publish.outputs.state }}

runs:
  using: composite
  steps:
    # Tell the store what this run is doing, so "what happened to my build" is answered on the
    # extension's own page instead of on GitHub. Carries no new credential: the same OIDC token that
    # publishes signs the report, and the store takes the repository from it, never from us.
    #
    # Every report step is best-effort. A status line has no business failing a publish, so they
    # swallow their own errors and always exit 0.
    - name: Tell the store the build started
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        API: ${{ inputs.api-base }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        # A refusal left behind by an earlier job on the same runner would be reported as this run's
        # reason. Self-hosted runners are the ones that keep a temp directory around.
        rm -f "${RUNNER_TEMP:-/tmp}/ency-store-refusal.txt"
        "$GITHUB_ACTION_PATH/report.sh" RUNNING || true
        exit 0

    - name: Pack build output (local CLI mode)
      id: pack
      if: ${{ inputs.folder != '' && inputs.pack-cli != '' }}
      shell: bash
      env:
        FOLDER: ${{ inputs.folder }}
        PACK_CLI: ${{ inputs.pack-cli }}
        STAMP_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ ! -e "$PACK_CLI" ]; then
          echo "::error::pack CLI not found at: $PACK_CLI"
          exit 1
        fi
        if [ ! -d "$FOLDER" ]; then
          echo "::error::build-output folder not found: $FOLDER"
          exit 1
        fi
        info="$FOLDER/package.info.json"
        if [ ! -f "$info" ]; then
          echo "::error::$info is missing. The pack CLI needs it (packageId, version, tags with 'ency-extension')."
          exit 1
        fi
        if [ -n "$STAMP_VERSION" ]; then
          echo "stamping version $STAMP_VERSION into package.info.json"
          tmp="$(mktemp)"
          jq --arg v "$STAMP_VERSION" '.version = $v' "$info" > "$tmp"
          mv "$tmp" "$info"
        fi
        out="$RUNNER_TEMP/ency-pack-$RANDOM"
        mkdir -p "$out"
        "$PACK_CLI" pack-library --folder "$FOLDER" --output "$out"
        # The CLI returns exit 0 even on fatal errors - judge by the artifact, not the exit code.
        nupkg="$(find "$out" -maxdepth 1 -name '*.nupkg' | head -n 1)"
        if [ -z "$nupkg" ]; then
          echo "::error::pack produced no .nupkg. The folder needs a flat dll + *.settings.json + package.info.json."
          exit 1
        fi
        echo "packed: $nupkg"
        echo "nupkg=$nupkg" >> "$GITHUB_OUTPUT"

    - name: Publish to the store
      id: publish
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        NUPKG_INPUT: ${{ inputs.nupkg }}
        NUPKG_PACKED: ${{ steps.pack.outputs.nupkg }}
        FOLDER: ${{ inputs.folder }}
        STAMP_VERSION: ${{ inputs.version }}
        LICENSED: ${{ inputs.licensed }}
        CATEGORY: ${{ inputs.category }}
        DRY_RUN: ${{ inputs.dry-run }}
        API: ${{ inputs.api-base }}
      run: |
        set -euo pipefail
        TOKEN="$(printf '%s' "$TOKEN" | sed 's/^[[:space:]]*Bearer[[:space:]]*//')"

        # Auth: a store token when given; otherwise the workflow's own GitHub OIDC token
        # (trusted publishing — works once this repository is bound to the package).
        AUTH_ARGS=()
        if [ -n "$TOKEN" ]; then
          AUTH_ARGS=(-H "Authorization: Bearer $TOKEN")
        elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "no store token given - authenticating with the GitHub OIDC token (trusted publishing)"
          ghjwt="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                   "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ency-extension-store" | jq -r '.value // empty')"
          if [ -z "$ghjwt" ]; then
            echo "::error::could not obtain a GitHub OIDC token."
            exit 1
          fi
          AUTH_ARGS=(-H "X-GitHub-OIDC-Token: $ghjwt")
        else
          echo "::error::no 'token' input and no GitHub OIDC available - add \"permissions: id-token: write\" to the workflow, or set the ENCY_STORE_TOKEN secret."
          exit 1
        fi

        # package source: a CLI-packed nupkg wins, then the 'nupkg' input (glob, newest match),
        # otherwise the 'folder' files go to the backend which packs them itself
        nupkg="$NUPKG_PACKED"
        if [ -z "$nupkg" ] && [ -n "$NUPKG_INPUT" ]; then
          shopt -s nullglob
          matches=( $NUPKG_INPUT )
          shopt -u nullglob
          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error::no .nupkg matches: $NUPKG_INPUT"
            exit 1
          fi
          nupkg="$(ls -t "${matches[@]}" | head -n 1)"
        fi
        if [ -z "$nupkg" ] && [ -z "$FOLDER" ]; then
          echo "::error::provide 'folder' (the backend packs it), 'nupkg' (ready package), or 'folder'+'pack-cli'."
          exit 1
        fi

        # Windows runners: schannel curl sporadically fails with CRYPT_E_REVOCATION_OFFLINE when
        # the CA's revocation endpoint is unreachable; --ssl-no-revoke skips only that check
        # (certificate chain validation stays on). Linux curl has no such flag.
        extra_curl=()
        case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) extra_curl+=(--ssl-no-revoke);; esac

        # Response headers of the LAST call, for the remarks the store attaches to a publish it
        # accepted. Every call truncates the file, so after the publish it holds the publish's own.
        hdrs="${RUNNER_TEMP:-/tmp}/ency-store-headers.txt"
        # …and its status code: `call` runs in a subshell, so a variable would not come back. Only the
        # publish reads it — 202 there is "accepted, not published yet", which carries no card.
        codefile="${RUNNER_TEMP:-/tmp}/ency-store-status.txt"

        call() { # method url curl-args... -> body on stdout; fails on non-2xx with body shown
          local method="$1" url="$2"; shift 2
          local body code
          body="$(mktemp)"
          code="$(curl -sS "${extra_curl[@]}" -X "$method" "$url" "${AUTH_ARGS[@]}" "$@" -D "$hdrs" -o "$body" -w '%{http_code}')"
          printf '%s' "$code" > "$codefile"
          if ! [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
            # The store explains refusals in the body, and its 403 for an unconnected repository
            # carries a ready-made link that fixes the run. Put that sentence in the annotation:
            # a red run shows annotations first, and "HTTP 403 from /storage/upload" on its own sends
            # the author digging through the step log for the one line that would have helped.
            local msg raw link detail label
            raw="$(jq -r '.message // empty' "$body" 2>/dev/null || true)"
            detail="$raw"
            if [ -z "$detail" ]; then
              # No JSON: this came from the proxy in front of the store rather than from the store,
              # and a 413 there means the upload was cut off for its size before anybody could word
              # it properly. Anything else gets the head of whatever was said.
              if [ "$code" = "413" ]; then
                detail="The package is larger than this store accepts — the upload was cut off before it reached the store."
              else
                detail="$(head -c 500 "$body")"
              fi
            fi
            # Keep the reason for the failure report at the end of this action. The store is the only
            # party that knows why it said no — a virus verdict, a package over the size limit — and
            # without this the author's card ends up saying "failed at Publish" above a build log
            # that reads "Build succeeded".
            #
            # One line on purpose: that is what lets the store print it on the card itself instead of
            # behind a "why" link, which is the difference between being told and going to look.
            printf 'HTTP %s — %s\n' "$code" "$(tr '\n\r' '  ' <<<"$detail" | sed 's/  */ /g')" \
              > "${RUNNER_TEMP:-/tmp}/ency-store-refusal.txt"
            # The job summary is the only place GitHub renders markdown, so it is the only place the
            # store's link can be clicked. An annotation shows the text but leaves a URL in the middle
            # of a sentence as plain characters — which is a link the author has to retype.
            if [ -n "$detail" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### The store refused this run (HTTP $code)"
                echo
                echo "$detail"
                # Only ever from the store's own sentence: a URL fished out of a proxy error page
                # would offer the author a button to nowhere.
                link="$(grep -oE 'https?://[^ )]+' <<<"$raw" | head -1)"
                # The sentence goes on after the link ("Open <link>, sign in and press I Agree"), and
                # its comma is not part of the address: /publish, is a page that does not exist, and
                # domains=none, reads as an area named "none".
                link="${link%[.,;:]}"
                if [ -n "$link" ]; then
                  # What the link leads to decides what the button says. A refusal links to the
                  # declaration, the terms, the repository connection, or Schedule A — the only legal
                  # document a refusal links to today (a missing or old-style declaration, from
                  # 1 November), and not the store at all. The terms are the publish page itself only,
                  # not /publishing-policy/ or a workflow's publish.yml.
                  case "$link" in
                    *"declare="*) label="Confirm the declaration in the store" ;;
                    *"/publish"|*"/publish?"*|*"/publish#"*) label="Register and accept the terms" ;;
                    *"connect="*) label="Connect the repository" ;;
                    *"/legal/"*) label="Read Schedule A" ;;
                    *) label="Open the store" ;;
                  esac
                  echo
                  echo "**[$label]($link)**"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            msg="$raw"
            if [ -n "$msg" ]; then
              # Workflow commands are one line and decode %25/%0D/%0A — escape the percent first, or
              # the %2F inside the store's own link eats the rest of the message.
              msg="${msg//'%'/%25}"; msg="${msg//$'\r'/%0D}"; msg="${msg//$'\n'/%0A}"
              echo "::error::HTTP $code — $msg" >&2
            else
              echo "::error::HTTP $code from $url" >&2
            fi
            cat "$body" >&2
            rm -f "$body"
            return 1
          fi
          cat "$body"
          rm -f "$body"
        }

        if [ -n "$nupkg" ]; then
          echo "== parse-nupkg (stages the original bytes): $nupkg =="
          parsed="$(call POST "$API/extensions/parse-nupkg" -F "file=@$nupkg")"
        else
          if [ ! -d "$FOLDER" ]; then
            echo "::error::build-output folder not found: $FOLDER"
            exit 1
          fi
          echo "== uploading build output for server-side packing: $FOLDER =="
          ids=()
          for f in "$FOLDER"/*; do
            [ -f "$f" ] || continue
            up="$(call POST "$API/storage/upload" -F "file=@$f")"
            ids+=( "$(jq -r '.uploadId' <<< "$up")" )
            echo "  uploaded $(basename "$f")"
          done
          if [ ${#ids[@]} -eq 0 ]; then
            echo "::error::no files in $FOLDER"
            exit 1
          fi
          payload="$(jq -cn --arg v "$STAMP_VERSION" \
                     '$ARGS.positional as $ids | {fileUploadIds:$ids} + (if $v != "" then {version:$v} else {} end)' \
                     --args "${ids[@]}")"
          echo "== pack-folder (the backend builds the package) =="
          parsed="$(call POST "$API/extensions/pack-folder" -H 'Content-Type: application/json' --data-binary "$payload")"
        fi
        pkgId="$(jq -r '.packageId // empty' <<< "$parsed")"
        ver="$(jq -r '.version // empty' <<< "$parsed")"
        upl="$(jq -r '.nupkgUploadId // empty' <<< "$parsed")"
        marker="$(jq -r '.hasMarker' <<< "$parsed")"
        echo "packageId=$pkgId version=$ver hasMarker=$marker"
        if [ -z "$pkgId" ] || [ -z "$ver" ] || [ -z "$upl" ]; then
          echo "::error::parse-nupkg returned incomplete data:"; echo "$parsed"
          exit 1
        fi
        if [ "$marker" != "true" ]; then
          echo "::error::the package has no 'ency-extension' tag - the catalog will not index it. Add the tag to package.info.json / nuspec and rebuild."
          exit 1
        fi

        if [ "$(echo "$DRY_RUN" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
          echo "DRY RUN: package is valid ($pkgId $ver), skipping publish."
          {
            echo "package-id=$pkgId"
            echo "version=$ver"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Dry run: package validated, publish skipped :white_check_mark:"
            echo ""
            echo "\`$pkgId\` \`$ver\` passed the server-side check (parse-nupkg)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        echo "== publish =="
        licensed_json=false
        case "$(echo "$LICENSED" | tr '[:upper:]' '[:lower:]')" in
          true|1|yes) licensed_json=true ;;
        esac
        # CI provenance: which repo/commit produced the package (backend records it on the
        # version row for the moderation/audit trail; older backends just ignore the fields).
        # Category: sent only when the workflow names one. An empty input is silence, not "clear it" —
        # the store keeps whatever the extension already had, so an extension sorted by hand does not
        # fall back to the default on the next tag push. The list of ids is at
        # <api-base>/categories (JSON) or /categories/guide.md (prose).
        payload="$(jq -cn --arg p "$pkgId" --arg v "$ver" --arg u "$upl" --argjson l "$licensed_json" \
                   --arg r "${GITHUB_REPOSITORY:-}" --arg s "${GITHUB_SHA:-}" --arg c "${CATEGORY:-}" \
                   '{packageId:$p, version:$v, nupkgUploadId:$u, licensed:$l}
                    + (if $r != "" then {sourceRepo:$r} else {} end)
                    + (if $s != "" then {sourceSha:$s} else {} end)
                    + (if $c != "" then {category:$c} else {} end)')"
        pub="$(call POST "$API/extensions" -H 'Content-Type: application/json' --data-binary "$payload")"
        # 202: accepted, but not in the feed yet — it waits for a moderator (state SUBMITTED) or to be
        # signed (PENDING/SIGNED). That is a success with no card, so no slug to ask for. Anything else
        # in 2xx is the card, as before.
        submitted=false
        if [ "$(cat "$codefile" 2>/dev/null || true)" = "202" ]; then
          submitted=true
        else
          slug="$(jq -r '.slug // empty' <<< "$pub")"
          if [ -z "$slug" ]; then
            echo "::error::publish returned no slug:"; echo "$pub"
            exit 1
          fi
        fi

        # What the store accepted but wants said out loud — today, a Schedule A declaration nobody
        # has answered yet. It arrives as X-Store-Warning, and a header nobody reads is silence:
        # ::warning:: puts it among the run's annotations, which a GREEN run shows too, and the job
        # summary keeps its link clickable. Refusals travel the other road (the error above); this
        # one exists so an author hears about the 1 November deadline before it starts refusing.
        notes="$(sed -n 's/^[Xx]-[Ss]tore-[Ww]arning:[[:space:]]*//p' "$hdrs" 2>/dev/null | sed 's/[[:cntrl:]]*$//')"
        if [ -n "$notes" ]; then
          {
            if [ "$submitted" = true ]; then echo "### Submitted, with a note from the store"
            else echo "### Published, with a note from the store"; fi
            echo ""
            while IFS= read -r note; do if [ -n "$note" ]; then echo "- $note"; fi; done <<< "$notes"
          } >> "$GITHUB_STEP_SUMMARY"
          # `if`, not `[ … ] && echo`: under `set -e` a false test as the last command of a loop
          # body ends the step — and ending a step that has already published is the one outcome a
          # remark must never cause.
          while IFS= read -r note; do
            # Workflow commands are one line and decode %25 — escape the percent, or a %2F in the
            # store's own link would eat the rest of the sentence.
            if [ -n "$note" ]; then echo "::warning::${note//'%'/%25}"; fi
          done <<< "$notes"
        fi

        if [ "$submitted" = true ]; then
          # The ids come from the store's answer, falling back to what parse-nupkg said (they are the
          # same package). A 202 may carry no body at all.
          s_pkg="$(jq -r '.packageId // empty' <<< "$pub" 2>/dev/null || true)"; s_pkg="${s_pkg:-$pkgId}"
          s_ver="$(jq -r '.version // empty' <<< "$pub" 2>/dev/null || true)"; s_ver="${s_ver:-$ver}"
          s_msg="$(jq -r '.message // empty' <<< "$pub" 2>/dev/null || true)"
          s_state="$(jq -r '.state // empty' <<< "$pub" 2>/dev/null || true)"
          s_msg="$(tr '\n\r' '  ' <<< "$s_msg" | sed 's/  */ /g; s/ *$//')"
          s_state="$(tr -cd 'A-Za-z_' <<< "$s_state")"
          # Classified the way the server does. SUBMITTED, or no state at all, waits for a moderator;
          # PENDING/SIGNED wait to be signed, and nobody has asked a moderator. FAILED, REJECTED and
          # WITHDRAWN will not reach the catalog as they are. The 202's sentence says "waiting to be
          # signed" for every state but SUBMITTED, so for the rest the state is named beside it and
          # nothing is promised. What the store's card says follows the same split: the version on its
          # way is SUBMITTED, one that stopped is FAILED with the reason, as a refusal would be.
          s_level=notice; s_icon=":hourglass_flowing_sand:"; report=SUBMITTED; reason=""
          case "$s_state" in
            ""|SUBMITTED)
              s_label="Submitted for review"
              s_body="${s_msg:-a moderator approves it before it appears in the catalog}" ;;
            PENDING|SIGNED)
              s_label="Accepted, not in the catalog yet"
              s_body="${s_msg:-it appears in the catalog once it reaches the feed}" ;;
            FAILED|REJECTED|WITHDRAWN)
              s_label="Not published"; s_level=warning; s_icon=":warning:"; report=FAILED
              s_body="the store took the upload but reports the version as $s_state, so it will not reach the catalog as it is${s_msg:+ (the store said: $s_msg)}"
              reason="HTTP 202 — the store took $s_pkg $s_ver but reports it as $s_state${s_msg:+: $s_msg}" ;;
            *)
              s_label="Accepted, not in the catalog yet"; s_level=warning; s_icon=":warning:"
              s_body="the store reports the version as $s_state${s_msg:+: $s_msg}" ;;
          esac
          s_line="$s_label: $s_pkg $s_ver — $s_body"
          # Workflow commands are one line and decode %25 — escape the percent first.
          echo "::$s_level::${s_line//'%'/%25}"
          {
            echo "package-id=$s_pkg"
            echo "version=$s_ver"
            echo "submitted=true"
            echo "state=$s_state"
            echo "report-status=$report"
            echo "report-reason=$reason"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $s_label $s_icon"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`$s_pkg\` |"
            echo "| Version | \`$s_ver\` |"
            echo ""
            echo "$s_body"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        store_base="${API%/api}"
        card="$store_base/extension/$slug"
        echo "PUBLISHED $pkgId $ver"
        echo "card: $card"
        {
          echo "package-id=$pkgId"
          echo "version=$ver"
          echo "slug=$slug"
          echo "card-url=$card"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### Published to the ENCY Extension Store :rocket:"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Package | \`$pkgId\` |"
          echo "| Version | \`$ver\` |"
          echo "| Card | $card |"
          echo ""
          echo "_The catalog indexes within a few minutes (reindexer runs every 15 min)._"
        } >> "$GITHUB_STEP_SUMMARY"

    # The two ends of the story. The store keeps only the latest state per repository, so a fresh
    # RUNNING wipes the previous failure and these two never pile up.
    - name: Tell the store it published
      if: success() && steps.publish.outputs.submitted != 'true'
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        API: ${{ inputs.api-base }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        "$GITHUB_ACTION_PATH/report.sh" PUBLISHED "${{ steps.publish.outputs.version }}" || true
        exit 0

    # Taken but not published (HTTP 202): the run is green, and the card in the store should say the
    # version waits (SUBMITTED) — or, when the store stopped it, why (FAILED) — rather than "building".
    # A store that does not know SUBMITTED yet answers 400: said as a warning, never a failure.
    - name: Tell the store it was taken
      if: success() && steps.publish.outputs.submitted == 'true'
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        API: ${{ inputs.api-base }}
        ACTION_REF: ${{ github.action_ref }}
        VERSION: ${{ steps.publish.outputs.version }}
        STATUS: ${{ steps.publish.outputs.report-status }}
        FAILED_STEP: ${{ steps.publish.outputs.report-status == 'FAILED' && 'Publish' || '' }}
        FAILURE_LOG: ${{ steps.publish.outputs.report-reason }}
        REPORT_WARN: 'true'
      run: |
        # Called the way every other report here is called. report.sh has no executable bit in git, so
        # on a Linux runner none of them runs (`|| true` keeps the step green) — as before this step
        # existed; a SUBMITTED that alone landed would be the store's word no later run replaces.
        "$GITHUB_ACTION_PATH/report.sh" "${STATUS:-SUBMITTED}" "$VERSION" || true
        exit 0

    - name: Tell the store it failed
      if: failure()
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        API: ${{ inputs.api-base }}
        ACTION_REF: ${{ github.action_ref }}
        # Which of OUR steps gave up. A compile error happens in the caller's workflow, before this
        # action runs at all — that one is reported by the workflow's own failure step.
        FAILED_STEP: ${{ steps.pack.outcome == 'failure' && 'Pack' || 'Publish' }}
      run: |
        # …and WHY, when the store said so. This report goes out before the caller's own catch-all
        # step, and the store keeps the first explanation of a run, so the reason survives the build
        # log that follows it.
        refusal="${RUNNER_TEMP:-/tmp}/ency-store-refusal.txt"
        if [ -s "$refusal" ]; then
          FAILURE_LOG="$(cat "$refusal")"
          export FAILURE_LOG
        fi
        "$GITHUB_ACTION_PATH/report.sh" FAILED || true
        exit 0
