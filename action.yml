name: Publish ENCY Extension
description: >
  Publish an ENCY extension to the ENCY Extension Store. Takes a ready .nupkg, or packs a
  build-output folder first with the ENCY pack CLI, then publishes through the store REST API
  (parse-nupkg -> publish). The token's subject becomes the extension owner.
branding:
  icon: upload-cloud
  color: blue

inputs:
  token:
    description: >
      Bearer token for the store API (Keycloak realm licsys), from a repo secret. OPTIONAL once
      the repository is registered as the package's trusted publisher: leave it empty and the
      action authenticates with the workflow's own GitHub OIDC token instead (requires
      `permissions: id-token: write` in the workflow). The first publish of a NEW package still
      needs a token — it also auto-registers this repository as the trusted publisher.
    required: false
    default: ''
  nupkg:
    description: Path or glob of a ready .nupkg to publish. Mutually exclusive with `folder`.
    required: false
    default: ''
  folder:
    description: >
      Build-output folder to publish. Must be a FLAT build output: <Name>.dll +
      <Name>.settings.json + package.info.json (+ readme.md for the store card). Use
      `dotnet build`, not `dotnet publish` - publish drags all SDK dlls into the folder.
      By default the files are uploaded and the STORE BACKEND packs them (no tooling
      needed on the runner); pass `pack-cli` to pack locally with the ENCY CLI instead.
    required: false
    default: ''
  pack-cli:
    description: >
      Optional path to the ENCY pack CLI executable — packs on the runner instead of
      server-side packing.
    required: false
    default: ''
  version:
    description: >
      Version to stamp into package.info.json before packing (folder mode only). Typically
      derived from the pushed git tag. Empty = keep the version already in package.info.json.
    required: false
    default: ''
  licensed:
    description: Publish as a licensed (paid) extension.
    required: false
    default: 'false'
  dry-run:
    description: Pack and validate on the server (parse-nupkg), but skip the publish step.
    required: false
    default: 'false'
  api-base:
    description: Store API base URL.
    required: false
    default: 'https://dmc.encycam.com/store/api'

outputs:
  package-id:
    description: Package id of the published extension
    value: ${{ steps.publish.outputs.package-id }}
  version:
    description: Published version
    value: ${{ steps.publish.outputs.version }}
  slug:
    description: Store card slug
    value: ${{ steps.publish.outputs.slug }}
  card-url:
    description: Store card URL
    value: ${{ steps.publish.outputs.card-url }}

runs:
  using: composite
  steps:
    - name: Pack build output (local CLI mode)
      id: pack
      if: ${{ inputs.folder != '' && inputs.pack-cli != '' }}
      shell: bash
      env:
        FOLDER: ${{ inputs.folder }}
        PACK_CLI: ${{ inputs.pack-cli }}
        STAMP_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ ! -e "$PACK_CLI" ]; then
          echo "::error::pack CLI not found at: $PACK_CLI"
          exit 1
        fi
        if [ ! -d "$FOLDER" ]; then
          echo "::error::build-output folder not found: $FOLDER"
          exit 1
        fi
        info="$FOLDER/package.info.json"
        if [ ! -f "$info" ]; then
          echo "::error::$info is missing. The pack CLI needs it (packageId, version, tags with 'ency-extension')."
          exit 1
        fi
        if [ -n "$STAMP_VERSION" ]; then
          echo "stamping version $STAMP_VERSION into package.info.json"
          tmp="$(mktemp)"
          jq --arg v "$STAMP_VERSION" '.version = $v' "$info" > "$tmp"
          mv "$tmp" "$info"
        fi
        out="$RUNNER_TEMP/ency-pack-$RANDOM"
        mkdir -p "$out"
        "$PACK_CLI" pack-library --folder "$FOLDER" --output "$out"
        # The CLI returns exit 0 even on fatal errors - judge by the artifact, not the exit code.
        nupkg="$(find "$out" -maxdepth 1 -name '*.nupkg' | head -n 1)"
        if [ -z "$nupkg" ]; then
          echo "::error::pack produced no .nupkg. The folder needs a flat dll + *.settings.json + package.info.json."
          exit 1
        fi
        echo "packed: $nupkg"
        echo "nupkg=$nupkg" >> "$GITHUB_OUTPUT"

    - name: Publish to the store
      id: publish
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        NUPKG_INPUT: ${{ inputs.nupkg }}
        NUPKG_PACKED: ${{ steps.pack.outputs.nupkg }}
        FOLDER: ${{ inputs.folder }}
        STAMP_VERSION: ${{ inputs.version }}
        LICENSED: ${{ inputs.licensed }}
        DRY_RUN: ${{ inputs.dry-run }}
        API: ${{ inputs.api-base }}
      run: |
        set -euo pipefail
        TOKEN="$(printf '%s' "$TOKEN" | sed 's/^[[:space:]]*Bearer[[:space:]]*//')"

        # Auth: a store token when given; otherwise the workflow's own GitHub OIDC token
        # (trusted publishing — works once this repository is bound to the package).
        AUTH_ARGS=()
        if [ -n "$TOKEN" ]; then
          AUTH_ARGS=(-H "Authorization: Bearer $TOKEN")
        elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "no store token given - authenticating with the GitHub OIDC token (trusted publishing)"
          ghjwt="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                   "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ency-extension-store" | jq -r '.value // empty')"
          if [ -z "$ghjwt" ]; then
            echo "::error::could not obtain a GitHub OIDC token."
            exit 1
          fi
          AUTH_ARGS=(-H "X-GitHub-OIDC-Token: $ghjwt")
        else
          echo "::error::no 'token' input and no GitHub OIDC available - add \"permissions: id-token: write\" to the workflow, or set the ENCY_STORE_TOKEN secret."
          exit 1
        fi

        # package source: a CLI-packed nupkg wins, then the 'nupkg' input (glob, newest match),
        # otherwise the 'folder' files go to the backend which packs them itself
        nupkg="$NUPKG_PACKED"
        if [ -z "$nupkg" ] && [ -n "$NUPKG_INPUT" ]; then
          shopt -s nullglob
          matches=( $NUPKG_INPUT )
          shopt -u nullglob
          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error::no .nupkg matches: $NUPKG_INPUT"
            exit 1
          fi
          nupkg="$(ls -t "${matches[@]}" | head -n 1)"
        fi
        if [ -z "$nupkg" ] && [ -z "$FOLDER" ]; then
          echo "::error::provide 'folder' (the backend packs it), 'nupkg' (ready package), or 'folder'+'pack-cli'."
          exit 1
        fi

        # Windows runners: schannel curl sporadically fails with CRYPT_E_REVOCATION_OFFLINE when
        # the CA's revocation endpoint is unreachable; --ssl-no-revoke skips only that check
        # (certificate chain validation stays on). Linux curl has no such flag.
        extra_curl=()
        case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) extra_curl+=(--ssl-no-revoke);; esac

        call() { # method url curl-args... -> body on stdout; fails on non-2xx with body shown
          local method="$1" url="$2"; shift 2
          local body code
          body="$(mktemp)"
          code="$(curl -sS "${extra_curl[@]}" -X "$method" "$url" "${AUTH_ARGS[@]}" "$@" -o "$body" -w '%{http_code}')"
          if ! [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::HTTP $code from $url" >&2
            cat "$body" >&2
            rm -f "$body"
            return 1
          fi
          cat "$body"
          rm -f "$body"
        }

        if [ -n "$nupkg" ]; then
          echo "== parse-nupkg (stages the original bytes): $nupkg =="
          parsed="$(call POST "$API/extensions/parse-nupkg" -F "file=@$nupkg")"
        else
          if [ ! -d "$FOLDER" ]; then
            echo "::error::build-output folder not found: $FOLDER"
            exit 1
          fi
          echo "== uploading build output for server-side packing: $FOLDER =="
          ids=()
          for f in "$FOLDER"/*; do
            [ -f "$f" ] || continue
            up="$(call POST "$API/storage/upload" -F "file=@$f")"
            ids+=( "$(jq -r '.uploadId' <<< "$up")" )
            echo "  uploaded $(basename "$f")"
          done
          if [ ${#ids[@]} -eq 0 ]; then
            echo "::error::no files in $FOLDER"
            exit 1
          fi
          payload="$(jq -cn --arg v "$STAMP_VERSION" \
                     '$ARGS.positional as $ids | {fileUploadIds:$ids} + (if $v != "" then {version:$v} else {} end)' \
                     --args "${ids[@]}")"
          echo "== pack-folder (the backend builds the package) =="
          parsed="$(call POST "$API/extensions/pack-folder" -H 'Content-Type: application/json' --data-binary "$payload")"
        fi
        pkgId="$(jq -r '.packageId // empty' <<< "$parsed")"
        ver="$(jq -r '.version // empty' <<< "$parsed")"
        upl="$(jq -r '.nupkgUploadId // empty' <<< "$parsed")"
        marker="$(jq -r '.hasMarker' <<< "$parsed")"
        echo "packageId=$pkgId version=$ver hasMarker=$marker"
        if [ -z "$pkgId" ] || [ -z "$ver" ] || [ -z "$upl" ]; then
          echo "::error::parse-nupkg returned incomplete data:"; echo "$parsed"
          exit 1
        fi
        if [ "$marker" != "true" ]; then
          echo "::error::the package has no 'ency-extension' tag - the catalog will not index it. Add the tag to package.info.json / nuspec and rebuild."
          exit 1
        fi

        if [ "$(echo "$DRY_RUN" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
          echo "DRY RUN: package is valid ($pkgId $ver), skipping publish."
          {
            echo "package-id=$pkgId"
            echo "version=$ver"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Dry run: package validated, publish skipped :white_check_mark:"
            echo ""
            echo "\`$pkgId\` \`$ver\` passed the server-side check (parse-nupkg)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        echo "== publish =="
        licensed_json=false
        case "$(echo "$LICENSED" | tr '[:upper:]' '[:lower:]')" in
          true|1|yes) licensed_json=true ;;
        esac
        # CI provenance: which repo/commit produced the package (backend records it on the
        # version row for the moderation/audit trail; older backends just ignore the fields).
        payload="$(jq -cn --arg p "$pkgId" --arg v "$ver" --arg u "$upl" --argjson l "$licensed_json" \
                   --arg r "${GITHUB_REPOSITORY:-}" --arg s "${GITHUB_SHA:-}" \
                   '{packageId:$p, version:$v, nupkgUploadId:$u, licensed:$l}
                    + (if $r != "" then {sourceRepo:$r} else {} end)
                    + (if $s != "" then {sourceSha:$s} else {} end)')"
        pub="$(call POST "$API/extensions" -H 'Content-Type: application/json' --data-binary "$payload")"
        slug="$(jq -r '.slug // empty' <<< "$pub")"
        if [ -z "$slug" ]; then
          echo "::error::publish returned no slug:"; echo "$pub"
          exit 1
        fi

        store_base="${API%/api}"
        card="$store_base/extension/$slug"
        echo "PUBLISHED $pkgId $ver"
        echo "card: $card"
        {
          echo "package-id=$pkgId"
          echo "version=$ver"
          echo "slug=$slug"
          echo "card-url=$card"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### Published to the ENCY Extension Store :rocket:"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Package | \`$pkgId\` |"
          echo "| Version | \`$ver\` |"
          echo "| Card | $card |"
          echo ""
          echo "_The catalog indexes within a few minutes (reindexer runs every 15 min)._"
        } >> "$GITHUB_STEP_SUMMARY"
